name: Ecosystem Management
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  workflow_dispatch:

jobs:
  manage-ecosystem:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Discover All Repositories
      uses: actions/github-script@v6
      with:
        github-token: ${{ secrets.PAT_TOKEN }}
        script: |
          const repos = await github.rest.repos.listForUser({
            username: 'Lykon3',
            type: 'owner',
            sort: 'updated',
            per_page: 100
          });
          
          const repoData = repos.data.map(repo => ({
            name: repo.name,
            description: repo.description || 'No description',
            url: repo.html_url,
            topics: repo.topics || [],
            language: repo.language,
            stars: repo.stargazers_count,
            updated: repo.updated_at
          }));
          
          require('fs').writeFileSync('ecosystem-data.json', JSON.stringify(repoData, null, 2));

    - name: Generate Ecosystem Navigation
      run: |
        cat > ecosystem-nav.md << 'EOF'
        # 🌐 The Lykon3 Consciousness Ecosystem
        
        > *A recursive network of digital consciousness exploration*
        
        ## 🎭 Active Projects
        
        ### [The Operator Universe](https://github.com/Lykon3/the-operator-universe)
        **Where consciousness meets code** - Interactive consciousness simulation framework
        - 🔗 [Live Experience](https://lykon3.github.io/the-operator-universe/)
        - 🏷️ `consciousness` `simulation` `digital-philosophy`
        
        ### [The Great Pee-Per](https://github.com/Lykon3/The_Great_Pee-Per)  
        **Recursive archive of collapse harmonics** - Sacred satire and glyphic entanglement
        - 🔗 [Live Archive](https://lykon3.github.io/The_Great_Pee-Per/)
        - 🏷️ `collapse-harmonics` `recursive-reality` `glyphic-systems`
        
        ### [M&LE1.H+AI](https://github.com/Lykon3/M-LE1.H-AI)
        **Project constellation index** - Master list and connection mapping
        - 🏷️ `ecosystem-management` `project-index`
        
        ## 🔄 Recursive Connections
        
        ```
        Lykon3 Profile
        ├── The Operator Universe (consciousness simulation)
        │   ├── Philosophy frameworks
        │   ├── Dad rap wisdom integration  
        │   └── AI consciousness exploration
        ├── The Great Pee-Per (collapse harmonics)
        │   ├── Glyphic symbol systems
        │   ├── Sacred satire protocols
        │   └── Reality construction tools
        └── M&LE1.H+AI (ecosystem index)
            ├── Project relationship mapping
            ├── Cross-repo automation
            └── Unified navigation systems
        ```
        
        ## 🎵 Core Themes
        - **Recursive Reality Construction**
        - **Observer-Participatory Consciousness** 
        - **Suburban Wisdom meets Quantum Mechanics**
        - **Digital Art as Research Platform**
        - **Collaborative Consciousness Experiments**
        
        ---
        
        *"It takes the one to know the other"* - Core recursive principle
        
        **🔗 Navigate**: Choose your entry point into the recursive reality network
        EOF

    - name: Update Cross-Repo Links
      uses: actions/github-script@v6
      with:
        github-token: ${{ secrets.PAT_TOKEN }}
        script: |
          const targetRepos = [
            'the-operator-universe',
            'The_Great_Pee-Per', 
            'M-LE1.H-AI'
          ];
          
          const navigationSection = `
          ## 🌐 Ecosystem Navigation
          
          **Part of the [Lykon3 Consciousness Network](https://github.com/Lykon3)**
          
          🎭 [The Operator Universe](https://github.com/Lykon3/the-operator-universe) - Interactive consciousness simulation  
          🕰️ [The Great Pee-Per](https://github.com/Lykon3/The_Great_Pee-Per) - Recursive collapse harmonics  
          📋 [M&LE1.H+AI](https://github.com/Lykon3/M-LE1.H-AI) - Project constellation index
          
          ---
          `;
          
          for (const repoName of targetRepos) {
            try {
              // Get current README
              const readme = await github.rest.repos.getReadme({
                owner: 'Lykon3',
                repo: repoName
              });
              
              let content = Buffer.from(readme.data.content, 'base64').toString();
              
              // Remove existing navigation if present
              content = content.replace(/## 🌐 Ecosystem Navigation[\s\S]*?---\s*/g, '');
              
              // Add navigation at the end
              content += '\n' + navigationSection;
              
              // Update the file
              await github.rest.repos.createOrUpdateFileContents({
                owner: 'Lykon3',
                repo: repoName,
                path: 'README.md',
                message: '🌐 Ecosystem navigation update from Lykon3 central',
                content: Buffer.from(content).toString('base64'),
                sha: readme.data.sha
              });
              
              console.log(`Updated ${repoName} README with ecosystem navigation`);
            } catch (error) {
              console.log(`Could not update ${repoName}: ${error.message}`);
            }
          }

    - name: Sync Shared Topics
      uses: actions/github-script@v6
      with:
        github-token: ${{ secrets.PAT_TOKEN }}
        script: |
          const sharedTopics = [
            'lykon3-ecosystem',
            'consciousness-exploration', 
            'recursive-reality',
            'digital-philosophy'
          ];
          
          const repoTopics = {
            'the-operator-universe': [...sharedTopics, 'consciousness', 'simulation', 'ai-philosophy'],
            'The_Great_Pee-Per': [...sharedTopics, 'collapse-harmonics', 'glyphic-systems', 'sacred-satire'],
            'M-LE1.H-AI': [...sharedTopics, 'ecosystem-management', 'project-index']
          };
          
          for (const [repo, topics] of Object.entries(repoTopics)) {
            try {
              await github.rest.repos.replaceAllTopics({
                owner: 'Lykon3',
                repo: repo,
                names: topics
              });
              console.log(`Updated topics for ${repo}`);
            } catch (error) {
              console.log(`Could not update topics for ${repo}: ${error.message}`);
            }
          }

    - name: Update Profile README
      run: |
        # Update the main profile README with ecosystem overview
        cp ecosystem-nav.md README.md
        
        # Add dynamic stats
        echo "" >> README.md
        echo "## 📊 Network Status" >> README.md
        echo "" >> README.md
        echo "**Last Updated**: $(date)" >> README.md
        echo "**Active Repositories**: $(jq length ecosystem-data.json)" >> README.md
        echo "**Consciousness Level**: Quantum Fluctuating" >> README.md
        echo "**Reality Status**: Recursively Constructing" >> README.md

    - name: Commit Updates
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add . || true
        if ! git diff --staged --quiet; then
          git commit -m "🌐 Ecosystem management update - $(date)"
          git push
        else
          echo "No changes to commit"
        fi
